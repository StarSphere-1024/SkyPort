name: Auto Tag and Release

on:
  push:
    branches: [master, main]
    paths:
      - 'app/pubspec.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auto-tag-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-version-change:
    name: Select Unpublished Version
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.version_check.outputs.should_release }}
      tag_name: ${{ steps.version_check.outputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Select release
        id: version_check
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$REF_TYPE" != branch || ( "$REF_NAME" != master && "$REF_NAME" != main ) ]]; then
            echo "Automatic releases must use master or main" >&2
            exit 1
          fi
          CURRENT_VERSION=$(python3 .github/scripts/release_version.py)
          TAG_NAME="v${CURRENT_VERSION}"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

          if [ "$EVENT_NAME" != workflow_dispatch ]; then
            PREV_VERSION=$(git show HEAD~1:app/pubspec.yaml 2>/dev/null | sed -n 's/^version:[[:space:]]*\([^+[:space:]]*\).*/\1/p' || true)
            if [ "$CURRENT_VERSION" = "$PREV_VERSION" ]; then
              echo "Version unchanged"
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          if git show-ref --verify --quiet "refs/tags/$TAG_NAME"; then
            if [ "$(git rev-parse "$TAG_NAME^{commit}")" != "$(git rev-parse HEAD)" ]; then
              echo "$TAG_NAME belongs to another commit; use Publish Release on that tag or bump the version" >&2
              exit 1
            fi
          fi
          PUBLISHED=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$TAG_NAME\" and .draft == false) | .tag_name")
          if [ -n "$PUBLISHED" ]; then
            echo "$TAG_NAME is already published"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Release Unpublished Version
    needs: detect-version-change
    if: needs.detect-version-change.outputs.should_release == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag_name: ${{ needs.detect-version-change.outputs.tag_name }}
      create_tag: true
