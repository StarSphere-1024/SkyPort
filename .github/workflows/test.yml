name: Test

on:
  workflow_call:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7
  RUST_VERSION: 1.98.0

jobs:
  core:
    name: Rust core without Flutter
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: Install serial enumeration dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - name: Test independent core
        run: cargo test --locked -p skyport_core

  test:
    name: Unit & Widget Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate release version and AppImage patch rules
        run: |
          python3 .github/scripts/test_release_version.py
          python3 .github/scripts/test_patch_fastforge_appimage.py
          python3 .github/scripts/test_check_android_release.py
          python3 -m unittest discover -s .github/scripts -p test_check_android_apk.py

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: Install desktop and serial dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libgtk-3-dev ninja-build clang cmake pkg-config xvfb

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Download dependencies
        working-directory: app
        run: flutter pub get
      - name: Analyze
        working-directory: app
        run: flutter analyze


      - name: Run tests
        working-directory: .
        run: tool/test_quiet.sh --coverage

      - name: Exercise real bridge and UI over a pseudo-terminal
        run: xvfb-run -a python3 scripts/pty_ui_smoke.py

      - name: Check coverage threshold
        run: bash scripts/check_coverage.sh --threshold 70

