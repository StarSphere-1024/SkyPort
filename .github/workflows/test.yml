name: Test

on:
  workflow_call:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_CHANNEL: stable

jobs:
  core:
    name: Rust core without Flutter
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install serial enumeration dependency
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev pkg-config
      - name: Test independent core
        run: cargo test --locked -p skyport_core

  test:
    name: Unit & Widget Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install desktop and serial dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libgtk-3-dev ninja-build clang cmake pkg-config xvfb

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Download dependencies
        working-directory: SkyPort
        run: flutter pub get
      - name: Analyze
        working-directory: SkyPort
        run: flutter analyze


      - name: Run tests
        working-directory: .
        run: tool/test_quiet.sh --coverage

      - name: Exercise real bridge and UI over a pseudo-terminal
        run: xvfb-run -a python3 scripts/pty_ui_smoke.py

      - name: Exclude generated files from coverage
        working-directory: SkyPort
        run: |
          awk '
            /^SF:lib[\/\\](l10n[\/\\]app_localizations(_.*)?\.dart|src[\/\\]rust[\/\\].*\.dart)$/ { skip=1; next }
            /^SF:/ { skip=0 }
            !skip { print }
          ' coverage/lcov.info > coverage/lcov.filtered.info
          mv coverage/lcov.filtered.info coverage/lcov.info

      - name: Check coverage threshold
        working-directory: SkyPort
        run: |
          TOTAL_LF=$(grep "^LF:" coverage/lcov.info | awk -F: '{sum+=$2} END {print sum}')
          TOTAL_LH=$(grep "^LH:" coverage/lcov.info | awk -F: '{sum+=$2} END {print sum}')

          if [ "$TOTAL_LF" -eq 0 ]; then
            echo "❌ No coverage data found"
            exit 1
          fi

          COVERAGE_PCT=$((TOTAL_LH * 100 / TOTAL_LF))
          THRESHOLD=70

          echo "Coverage: ${COVERAGE_PCT}% (Lines Hit: $TOTAL_LH / Found: $TOTAL_LF)"
          echo "Threshold: ${THRESHOLD}%"

          if [ "$COVERAGE_PCT" -lt "$THRESHOLD" ]; then
            echo "❌ Coverage ${COVERAGE_PCT}% is below threshold ${THRESHOLD}%"
            exit 1
          else
            echo "✅ Coverage ${COVERAGE_PCT}% meets threshold ${THRESHOLD}%"
          fi

