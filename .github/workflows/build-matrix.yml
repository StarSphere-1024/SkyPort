name: Build (Linux + Windows)

on:
  workflow_call:
    inputs:
      retention-days:
        required: false
        type: number
        default: 7
    outputs:
      app_version:
        description: Extracted application version
        value: ${{ jobs.prepare.outputs.app_version }}

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare / Extract Version
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.version.outputs.app_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate committed version
        id: version
        env:
          TAG_NAME: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          APP_VERSION=$(python3 .github/scripts/release_version.py --tag "$TAG_NAME")
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "Building committed version: $APP_VERSION"

  build-linux:
    name: Build Linux
    needs: prepare
    uses: ./.github/workflows/build-linux.yml
    with:
      app_version: ${{ needs.prepare.outputs.app_version }}
      retention-days: ${{ inputs.retention-days }}

  build-windows:
    name: Build Windows
    needs: prepare
    uses: ./.github/workflows/build-windows.yml
    with:
      app_version: ${{ needs.prepare.outputs.app_version }}
      retention-days: ${{ inputs.retention-days }}

