name: Build Android

on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
      retention-days:
        type: number
        default: 7
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_STORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7
  RUST_VERSION: 1.98.0
  SKYPORT_ANDROID_ABIS: ${{ inputs.release && 'arm64-v8a' || 'x86_64' }}

jobs:
  android:
    name: Android ${{ inputs.release && 'signed release' || 'debug build' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ inputs.release && 'aarch64-linux-android' || 'x86_64-linux-android' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target/android'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install Android build dependencies
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358'
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
      - name: Validate committed version
        id: version
        run: |
          VERSION=$(python3 .github/scripts/release_version.py)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Download locked dependencies
        working-directory: app
        run: flutter pub get --enforce-lockfile
      - name: Restore release signing
        if: inputs.release
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          required = ('KEYSTORE', 'STORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD')
          if any(not os.environ.get(key) for key in required):
              raise SystemExit('Configure all four ANDROID_* signing secrets before release')
          directory = Path(os.environ['RUNNER_TEMP']) / 'android-signing'
          directory.mkdir(mode=0o700)
          store = directory / 'release.jks'
          store.write_bytes(base64.b64decode(os.environ['KEYSTORE'], validate=True))
          store.chmod(0o600)
          properties = directory / 'key.properties'
          values = dict(storeFile=str(store), storePassword=os.environ['STORE_PASSWORD'],
                        keyAlias=os.environ['KEY_ALIAS'], keyPassword=os.environ['KEY_PASSWORD'])
          def escape(value):
              encoded = value.encode('utf-16-be')
              return ''.join('\\u' + encoded[i:i+2].hex() for i in range(0, len(encoded), 2))
          properties.write_text(''.join(f'{key}={escape(value)}\n' for key, value in values.items()))
          properties.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'SKYPORT_ANDROID_KEY_PROPERTIES={properties}\n')
          PY
      - name: Build signed release APK
        if: inputs.release
        run: bash scripts/android_release.sh build
      - name: Build debug APK without release secrets
        if: ${{ !inputs.release }}
        working-directory: app
        run: flutter build apk --debug --target-platform android-x64
      - name: Check APK metadata, signing and 16 KB compatibility
        env:
          MODE: ${{ inputs.release && 'release' || 'debug' }}
        run: |
          DEBUG_FLAG=()
          if [ "$MODE" = debug ]; then DEBUG_FLAG+=(--debug); fi
          python3 scripts/check_android_apk.py "app/build/app/outputs/flutter-apk/app-${MODE}.apk" "${DEBUG_FLAG[@]}" \
            --abi "$SKYPORT_ANDROID_ABIS" --build-tools "$ANDROID_HOME/build-tools/36.0.0"
      - name: Prepare immutable release candidate
        if: inputs.release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p app/dist/android
          cp app/build/app/outputs/flutter-apk/app-release.apk "app/dist/android/SkyPort-v${VERSION}-android-arm64.apk"
          cd app/dist/android
          sha256sum *.apk > SHA256SUMS-android.txt
      - name: Upload signed release candidate
        if: inputs.release
        uses: actions/upload-artifact@v7
        with:
          name: SkyPort-v${{ steps.version.outputs.version }}-android-arm64-apk
          path: app/dist/android/*
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}
      - name: Remove signing material
        if: always() && inputs.release
        run: rm -rf "$RUNNER_TEMP/android-signing"
