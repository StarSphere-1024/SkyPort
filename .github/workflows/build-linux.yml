name: Build Linux

on:
  workflow_call:
    inputs:
      app_version:
        required: true
        type: string
      retention-days:
        required: false
        type: number
        default: 7

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.7
  RUST_VERSION: 1.98.0

jobs:
  linux:
    name: Linux Packages
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
            arch_name: amd64
            appimage_arch: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            arch_name: arm64
            appimage_arch: arm_aarch64
    env:
      APP_VERSION: ${{ inputs.app_version }}
      ARCH_NAME: ${{ matrix.arch_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> app/build/linux/${{ matrix.arch }}/release/rust"

      - name: Setup Flutter (Manual for ARM64)
        if: matrix.arch == 'arm64'
        run: |
          git clone https://github.com/flutter/flutter.git -b ${{ env.FLUTTER_VERSION }} $HOME/flutter --depth 1
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          echo "$HOME/flutter/bin/cache/dart-sdk/bin" >> $GITHUB_PATH
          echo "$HOME/.pub-cache/bin" >> $GITHUB_PATH

      - name: Setup Flutter (Standard for x64)
        if: matrix.arch != 'arm64'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
          architecture: x64

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libudev-dev liblzma-dev libstdc++-12-dev patchelf xvfb rpm libarchive-tools libfuse2

      - name: Install AppImage tool (appimagetool)
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            URL="https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-aarch64.AppImage"
            SHA256="f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158"
          else
            URL="https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage"
            SHA256="ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0"
          fi
          curl --fail --location -o appimagetool.AppImage "$URL"
          echo "$SHA256  appimagetool.AppImage" | sha256sum --check -
          chmod +x appimagetool.AppImage
          sudo mv appimagetool.AppImage /usr/local/bin/appimagetool
          appimagetool --version || echo "appimagetool installed"

      - name: Download locked Dart/Flutter deps
        working-directory: app
        run: flutter pub get --enforce-lockfile

      - name: Patch fastforge package generators
        run: |
          python3 .github/scripts/patch_fastforge_appimage.py
          python3 .github/scripts/patch_fastforge_rpm.py

      - name: Check RPM install paths across build directories
        run: python3 .github/scripts/test_patch_fastforge_rpm.py

      - name: Build once and package deb, RPM, and AppImage
        working-directory: app
        env:
          ARCH: ${{ matrix.appimage_arch }}
        # Fastforge reuses one build result across targets in a single package call.
        run: dart run fastforge:main package --platform linux --targets deb,rpm,appimage

      - name: Normalize and exercise all packages
        working-directory: app
        run: |
          mkdir -p dist/standard
          for EXT in deb rpm AppImage; do
            PACKAGES=(dist/release/*/*."$EXT")
            if [ "${#PACKAGES[@]}" -ne 1 ] || [ ! -f "${PACKAGES[0]}" ]; then
              echo "Expected exactly one .$EXT file under dist/release/*/" >&2
              exit 1
            fi
            TARGET="dist/standard/SkyPort-v${APP_VERSION}-linux-${ARCH_NAME}.${EXT}"
            cp "${PACKAGES[0]}" "$TARGET"
            xvfb-run -a python3 ../scripts/package_smoke.py "$TARGET"
          done

      - name: Upload deb artifact
        uses: actions/upload-artifact@v7
        with:
          name: SkyPort-v${{ env.APP_VERSION }}-linux-${{ matrix.arch_name }}-deb
          path: app/dist/standard/SkyPort-v${{ env.APP_VERSION }}-linux-${{ matrix.arch_name }}.deb
          retention-days: ${{ inputs.retention-days }}

      - name: Upload RPM artifact
        uses: actions/upload-artifact@v7
        with:
          name: SkyPort-v${{ env.APP_VERSION }}-linux-${{ matrix.arch_name }}-rpm
          path: app/dist/standard/SkyPort-v${{ env.APP_VERSION }}-linux-${{ matrix.arch_name }}.rpm
          retention-days: ${{ inputs.retention-days }}

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: SkyPort-v${{ env.APP_VERSION }}-linux-${{ matrix.arch_name }}-appimage
          path: app/dist/standard/SkyPort-v${{ env.APP_VERSION }}-linux-${{ matrix.arch_name }}.AppImage
          retention-days: ${{ inputs.retention-days }}
